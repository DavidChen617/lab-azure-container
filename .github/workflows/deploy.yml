name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  USERNAME: davidchen617

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/nginx:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/nginx:latest

      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: ./src/Presentation
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/web:latest

      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: ./src/Api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.USERNAME }}/api:latest

  terraform:
    name: Terraform Apply
    runs-on: self-hosted
    needs: build-and-push
    env:
      TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
      TF_VAR_image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Import existing resources (if any)
        working-directory: infra
        run: |
          SUB="063697f1-d90f-41b1-a6a9-ebd64fdf3ba2"
          RG="final-report-rg"

          if az group show --name $RG &>/dev/null; then
            terraform import azurerm_resource_group.rg \
              /subscriptions/$SUB/resourceGroups/$RG
          fi

          if az containerapp env show --name final-report-env --resource-group $RG &>/dev/null; then
            terraform import azurerm_container_app_environment.env \
              /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/final-report-env
          fi

          if az containerapp show --name final-report-app --resource-group $RG &>/dev/null; then
            terraform import azurerm_container_app.app \
              /subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.App/containerApps/final-report-app
          fi

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve
