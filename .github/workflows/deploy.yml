name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  USERNAME: davidchen617

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/nginx:latest

      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: ./src/Presentation
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/web:latest

      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: ./src/Api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/api:latest

  terraform:
    name: Terraform Apply
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Import existing resources (if any)
        working-directory: infra
        run: |
          terraform import azurerm_resource_group.rg \
            /subscriptions/063697f1-d90f-41b1-a6a9-ebd64fdf3ba2/resourceGroups/final-report-rg \
            2>/dev/null || true
          terraform import azurerm_container_app_environment.env \
            /subscriptions/063697f1-d90f-41b1-a6a9-ebd64fdf3ba2/resourceGroups/final-report-rg/providers/Microsoft.App/managedEnvironments/final-report-env \
            2>/dev/null || true
          terraform import azurerm_container_app.app \
            /subscriptions/063697f1-d90f-41b1-a6a9-ebd64fdf3ba2/resourceGroups/final-report-rg/providers/Microsoft.App/containerApps/final-report-app \
            2>/dev/null || true

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
