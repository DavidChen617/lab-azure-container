name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  USERNAME: davidchen617

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/nginx:latest

      - name: Build & Push web
        uses: docker/build-push-action@v6
        with:
          context: ./src/Presentation
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/web:latest

      - name: Build & Push api
        uses: docker/build-push-action@v6
        with:
          context: ./src/Api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.USERNAME }}/api:latest

  terraform:
    name: Terraform Apply
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve
